# specs/registry-images-plan.md: publiceert kant-en-klare images naar ghcr.io bij elke definitieve
# release-tag (v3.8.0, niet v3.8.0-alpha.1), zodat een bestaande installatie kan updaten met
# `docker compose pull` i.p.v. eerst de repo te clonen en lokaal te bouwen. Alleen op main-tags,
# want de -alpha-reeks op dev is bewust een checkpoint-tag, geen deploy-kandidaat.
name: Publish images

on:
  push:
    tags: ['v*']

jobs:
  build:
    if: ${{ !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [webapp, mosquitto, telegraf, telegraf-herstarter, grafana, caddy, simulator]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/tbizla/stroom-dashboard-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/tbizla/stroom-dashboard-${{ matrix.service }}:latest
