# specs/registry-images-plan.md: elke zelf-gebouwde service heeft zowel `build:` als `image:` — bij
# `docker compose build` bouwt Compose gewoon lokaal (ontwikkelen/testen blijft dus ongewijzigd
# werken), bij `docker compose pull` haalt Compose in plaats daarvan de bijbehorende, door CI
# gepubliceerde image op (ghcr.io) — dat is de bedoelde manier om een bestaande installatie te
# updaten zonder een lokale build (zie README §4). `STROOM_DASHBOARD_VERSION` in .env pint een
# specifieke versie; leeg/ontbrekend = `latest`.
services:
  # specs/shelly-auto-configuratie-plan.md (kritieke bevinding, 7 augustus 2026): sinds de webapp's
  # eigen /mqtt-websocket-proxy (specs/toegang-van-buitenaf-diagnose.md bevinding #2) verbindt de
  # BROWSER niet meer rechtstreeks met mosquitto — die gaat terecht via de webapp (poort 8080). Maar
  # een fysieke Shelly is geen browser: die praat gewoon rechtstreeks TCP/MQTT naar <host>:1883 en
  # kan onmogelijk via een sessie-gegate websocketproxy in de webapp. Poort 1883 hoort dus WEL naar
  # de host gepubliceerd te blijven — alleen 9001 (websockets) is terecht vervangen door de
  # webapp-proxy en blijft dicht. Zonder 1883 was er sinds commit 721172c domweg geen enkele fysieke
  # Shelly meer bereikbaar voor de broker (door geen van de drie latere code-review-rondes op
  # "Toegang van buitenaf" opgemerkt — die waren gericht op auth/security van de webapp zelf, niet
  # op de fysieke-apparaten-kant van de pijplijn). allow_anonymous true blijft een bewuste,
  # geaccepteerde keuze (zelfde vertrouwensmodel als nu al voor poort 8080 op het lokale netwerk).
  mosquitto:
    build: ./mosquitto
    image: ghcr.io/tbizla/stroom-dashboard-mosquitto:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      # specs/externe-mqtt-broker-plan.md: mosquitto.conf's `include_dir` laadt elke .conf hierin —
      # leeg bij een normale installatie (geen gedragswijziging), de webapp schrijft hier een
      # bridge.conf in zodra een externe MQTT-broker geconfigureerd wordt (zie de webapp-mount
      # hieronder bij die service)
      - mosquitto-bridge-conf:/mosquitto/config/conf.d:ro

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=site
      - DOCKER_INFLUXDB_INIT_BUCKET=stroomdata
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    build: ./telegraf
    image: ghcr.io/tbizla/stroom-dashboard-telegraf:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - EVENT_EDITION=${EVENT_EDITION}
      - EVENT_NAME=${EVENT_NAME}

  # klein, doelbewust beperkt servicetje voor het herstarten van telegraf na een
  # EVENT_NAME/EVENT_EDITION-wijziging vanuit Beheer. Krijgt de échte /var/run/docker.sock,
  # maar biedt naar buiten toe maar precies één actie
  # (POST /herstart) — geen generieke Docker-API-doorgifte. Kant-en-klare socket-proxy's
  # (tecnativa/docker-socket-proxy en de linuxserver.io-fork) bleken geen DELETE-requests door te
  # laten (bewuste designkeuze in die projecten), wat een echte container-recreate onmogelijk
  # maakt — vandaar dit eigen servicetje i.p.v. zo'n kant-en-klare proxy.
  telegraf-herstarter:
    build: ./telegraf-herstarter
    image: ghcr.io/tbizla/stroom-dashboard-telegraf-herstarter:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: telegraf-herstarter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # los renderer-service voor Grafana panel-screenshots, gebruikt door Grafana's eigen /render-
  # HTTP-endpoint (zie /api/rapport/* in webapp/server.js voor de PDF-rapportfunctie) — geen eigen
  # poort naar buiten nodig
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: renderer
    restart: unless-stopped
    environment:
      - RENDERING_MODE=clustered
      - RENDERING_CLUSTERING_MODE=browser
      - RENDERING_CLUSTERING_MAX_CONCURRENCY=5

  grafana:
    build: ./grafana
    image: ghcr.io/tbizla/stroom-dashboard-grafana:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - influxdb
      - renderer
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_INSTALL_PLUGINS=netsage-sankey-panel
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana

  # specs/lan-ip-detectie-verplaatsen-plan.md: eenmalige, wegwerp-init-service die het LAN-IP van de
  # HOST detecteert (network_mode: host, dus ziet de echte netwerkinterfaces) en wegschrijft naar
  # een gedeeld volume — vervangt het losse start.sh/start.ps1-wrapperscriptje dat dit voorheen op
  # de host zelf deed vóór het aanroepen van `docker compose`. Alleen déze kleine service draait in
  # host-netwerkmodus; webapp zelf blijft op het normale Docker-bridge-netwerk staan, dus alle
  # bestaande service-naam-DNS (influxdb:8086, mosquitto:1883, enz.) blijft ongewijzigd werken. Een
  # bestand op een gedeeld volume i.p.v. een env-var, want een env-var kan niet ná het opstarten van
  # een andere service alsnog gezet worden.
  lan-ip-detector:
    image: alpine:3.20
    container_name: lan-ip-detector
    network_mode: host
    command: >
      sh -c "
        IP=$$(ip route get 1.1.1.1 2>/dev/null | sed -n 's/.* src \\([0-9.]*\\).*/\\1/p');
        if [ -z \"$$IP\" ]; then IP=$$(hostname -I 2>/dev/null | awk '{print $$1}'); fi;
        echo -n \"$$IP\" > /shared/host_lan_ip.txt;
        echo Host-IP gedetecteerd: $$IP
      "
    volumes:
      - lan-ip-shared:/shared

  webapp:
    build: ./webapp
    image: ghcr.io/tbizla/stroom-dashboard-webapp:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: webapp
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_started
      telegraf-herstarter:
        condition: service_started
      lan-ip-detector:
        condition: service_completed_successfully
    # blijft altijd gepubliceerd, ook met de `publiek`-profile (Caddy) actief — nodig voor het
    # bestaande op-locatie-gebruik (crew-telefoons op hetzelfde festivalnetwerk, zie lan-ip-detector
    # hierboven en de QR-code-deeplinks), dat is onafhankelijk van internet-toegang via Caddy.
    # vervolgticket-toegang-van-buitenaf.md §3: zodra deze instance ook publiek (internet) bereikbaar
    # is, hoort poort 8080 zelf NIET vanaf het publieke internet bereikbaar te zijn (alleen 80/443
    # via Caddy) — regel dat op netwerkniveau af (firewall/security group), niet hier in compose:
    # een `ports:`-mapping is altijd aan/uit, kan niet conditioneel per profile.
    ports:
      - "8080:8080"
    environment:
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=site
      - INFLUX_BUCKET=stroomdata
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_DASHBOARD_UID=stroom-dashboard-overzicht
      - GRAFANA_REPORT_TOKEN=${GRAFANA_REPORT_TOKEN}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
      - EVENT_NAME=${EVENT_NAME}
      - EVENT_EDITION=${EVENT_EDITION}
      - TELEGRAF_HERSTARTER_URL=http://telegraf-herstarter:8090
      - SESSION_SECRET=${SESSION_SECRET}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # gebruikt hier alleen als signaal "draait achter Caddy/TLS" (secure-cookie-vlag, server.js) —
      # niet voor routering, dat regelt caddy/Caddyfile zelf
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-}
    volumes:
      - webapp-data:/data
      - lan-ip-shared:/shared:ro
      # specs/externe-mqtt-broker-plan.md: schrijfbaar hier, alleen-lezen bij mosquitto zelf
      # hierboven — de webapp genereert bridge.conf, mosquitto leest 'm bij een herstart
      - mosquitto-bridge-conf:/mosquitto-bridge

  # alleen gestart met `docker compose --profile test up -d` — de webapp herkent zelf of deze
  # service bestaat (DNS-lookup op "simulator", zie isTestMode() in server.js) om de Testdata-tabblad
  # endpoints vrij te geven, dus dit ene commando is genoeg om testmodus aan/uit te zetten
  simulator:
    build: ./simulator
    image: ghcr.io/tbizla/stroom-dashboard-simulator:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: simulator
    restart: unless-stopped
    profiles: ["test"]
    depends_on:
      - mosquitto
      - webapp
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - TOPOLOGY_URL=http://webapp:8080/api/topology
      - INTERVAL_MS=1000
      - PEAK_CHANCE=0.01
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}

  # optioneel, alleen nodig zodra deze locatie-instance van buitenaf (publiek internet) bereikbaar
  # moet zijn (specs/toegang-van-buitenaf-diagnose.md) — TLS-terminatie + reverse-proxy naar de
  # webapp, zie caddy/Caddyfile. Lokaal ontwikkelen/testen blijft gewoon rechtstreeks op
  # http://localhost:8080 zonder Caddy ertussen — alleen gestart met
  # `docker compose --profile publiek up -d`.
  caddy:
    build: ./caddy
    image: ghcr.io/tbizla/stroom-dashboard-caddy:${STROOM_DASHBOARD_VERSION:-latest}
    container_name: caddy
    restart: unless-stopped
    profiles: ["publiek"]
    depends_on:
      - webapp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # let op: NIET ${PUBLIC_DOMAIN:-} — dat zet de env-var altijd (al is 't leeg), en Caddy's eigen
      # `{$PUBLIC_DOMAIN:localhost}`-placeholder valt alleen terug op de default als de variabele
      # volledig ontbreekt, niet als 'm leeg-maar-gezet is. Zonder deze `:-localhost` hier crasht
      # Caddy in een restart-loop ("unrecognized global option: reverse_proxy", want een lege
      # site-adres-regel wordt als het globale-opties-blok geparsed) zodra PUBLIC_DOMAIN niet in
      # .env staat — ontdekt bij het herstellen van deze service (caddy-herstel-plan.md), was
      # kennelijk nooit end-to-end getest zonder een echt ingevuld domein.
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mosquitto-data:
  mosquitto-log:
  mosquitto-bridge-conf:
  influxdb-data:
  grafana-data:
  webapp-data:
  caddy-data:
  caddy-config:
  lan-ip-shared:
