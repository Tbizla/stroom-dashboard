services:
  # sinds de webapp's eigen /mqtt-websocket-proxy (specs/toegang-van-buitenaf-diagnose.md
  # bevinding #2) verbindt niets meer rechtstreeks met mosquitto van buiten het docker-netwerk —
  # de browser gaat altijd via de webapp (poort 8080), de simulator via het interne
  # mqtt://mosquitto:1883-adres. Geen ports: meer nodig, allow_anonymous true in mosquitto.conf is
  # daardoor weer veilig (niet meer extern bereikbaar, net als InfluxDB/Grafana hieronder).
  mosquitto:
    build: ./mosquitto
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=site
      - DOCKER_INFLUXDB_INIT_BUCKET=stroomdata
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  telegraf:
    build: ./telegraf
    container_name: telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - EVENT_EDITION=${EVENT_EDITION}
      - EVENT_NAME=${EVENT_NAME}

  # klein, doelbewust beperkt servicetje voor het herstarten van telegraf na een
  # EVENT_NAME/EVENT_EDITION-wijziging vanuit Beheer. Krijgt de échte /var/run/docker.sock,
  # maar biedt naar buiten toe maar precies één actie
  # (POST /herstart) — geen generieke Docker-API-doorgifte. Kant-en-klare socket-proxy's
  # (tecnativa/docker-socket-proxy en de linuxserver.io-fork) bleken geen DELETE-requests door te
  # laten (bewuste designkeuze in die projecten), wat een echte container-recreate onmogelijk
  # maakt — vandaar dit eigen servicetje i.p.v. zo'n kant-en-klare proxy.
  telegraf-herstarter:
    build: ./telegraf-herstarter
    container_name: telegraf-herstarter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # los renderer-service voor Grafana panel-screenshots, gebruikt door Grafana's eigen /render-
  # HTTP-endpoint (zie /api/rapport/* in webapp/server.js voor de PDF-rapportfunctie) — geen eigen
  # poort naar buiten nodig
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: renderer
    restart: unless-stopped
    environment:
      - RENDERING_MODE=clustered
      - RENDERING_CLUSTERING_MODE=browser
      - RENDERING_CLUSTERING_MAX_CONCURRENCY=5

  grafana:
    build: ./grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - influxdb
      - renderer
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
      - GF_INSTALL_PLUGINS=netsage-sankey-panel
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - grafana-data:/var/lib/grafana

  webapp:
    build: ./webapp
    container_name: webapp
    restart: unless-stopped
    depends_on:
      - influxdb
      - telegraf-herstarter
    # blijft altijd gepubliceerd, ook met de `publiek`-profile (Caddy) actief — nodig voor het
    # bestaande op-locatie-gebruik (crew-telefoons op hetzelfde festivalnetwerk, zie HOST_LAN_IP/
    # start.sh en de QR-code-deeplinks), dat is onafhankelijk van internet-toegang via Caddy.
    # vervolgticket-toegang-van-buitenaf.md §3: zodra deze instance ook publiek (internet) bereikbaar
    # is, hoort poort 8080 zelf NIET vanaf het publieke internet bereikbaar te zijn (alleen 80/443
    # via Caddy) — regel dat op netwerkniveau af (firewall/security group), niet hier in compose:
    # een `ports:`-mapping is altijd aan/uit, kan niet conditioneel per profile.
    ports:
      - "8080:8080"
    environment:
      - HOST_LAN_IP=${HOST_LAN_IP:-}
      - INFLUX_URL=http://influxdb:8086
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_ORG=site
      - INFLUX_BUCKET=stroomdata
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_DASHBOARD_UID=stroom-dashboard-overzicht
      - GRAFANA_REPORT_TOKEN=${GRAFANA_REPORT_TOKEN}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
      - EVENT_NAME=${EVENT_NAME}
      - EVENT_EDITION=${EVENT_EDITION}
      - TELEGRAF_HERSTARTER_URL=http://telegraf-herstarter:8090
      - SESSION_SECRET=${SESSION_SECRET}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}
      # gebruikt hier alleen als signaal "draait achter Caddy/TLS" (secure-cookie-vlag, server.js) —
      # niet voor routering, dat regelt caddy/Caddyfile zelf
      - PUBLIC_DOMEIN=${PUBLIC_DOMEIN:-}
    volumes:
      - webapp-data:/data

  # alleen gestart met `docker compose --profile test up -d` — de webapp herkent zelf of deze
  # service bestaat (DNS-lookup op "simulator", zie isTestMode() in server.js) om de Testdata-tabblad
  # endpoints vrij te geven, dus dit ene commando is genoeg om testmodus aan/uit te zetten
  simulator:
    build: ./simulator
    container_name: simulator
    restart: unless-stopped
    profiles: ["test"]
    depends_on:
      - mosquitto
      - webapp
    environment:
      - MQTT_URL=mqtt://mosquitto:1883
      - TOPOLOGY_URL=http://webapp:8080/api/topology
      - INTERVAL_MS=1000
      - PIEK_KANS=0.01
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN}

  # optioneel, alleen nodig zodra deze locatie-instance van buitenaf (publiek internet) bereikbaar
  # moet zijn (specs/toegang-van-buitenaf-diagnose.md) — TLS-terminatie + reverse-proxy naar de
  # webapp, zie caddy/Caddyfile. Lokaal ontwikkelen/testen blijft gewoon rechtstreeks op
  # http://localhost:8080 zonder Caddy ertussen — alleen gestart met
  # `docker compose --profile publiek up -d`.
  caddy:
    build: ./caddy
    container_name: caddy
    restart: unless-stopped
    profiles: ["publiek"]
    depends_on:
      - webapp
    ports:
      - "80:80"
      - "443:443"
    environment:
      # let op: NIET ${PUBLIC_DOMEIN:-} — dat zet de env-var altijd (al is 't leeg), en Caddy's eigen
      # `{$PUBLIC_DOMEIN:localhost}`-placeholder valt alleen terug op de default als de variabele
      # volledig ontbreekt, niet als 'm leeg-maar-gezet is. Zonder deze `:-localhost` hier crasht
      # Caddy in een restart-loop ("unrecognized global option: reverse_proxy", want een lege
      # site-adres-regel wordt als het globale-opties-blok geparsed) zodra PUBLIC_DOMEIN niet in
      # .env staat — ontdekt bij het herstellen van deze service (caddy-herstel-plan.md), was
      # kennelijk nooit end-to-end getest zonder een echt ingevuld domein.
      - PUBLIC_DOMEIN=${PUBLIC_DOMEIN:-localhost}
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  grafana-data:
  webapp-data:
  caddy-data:
  caddy-config:
