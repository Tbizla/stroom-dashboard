listener 1883
protocol mqtt

# Websockets, handig als je ooit een browser-dashboard rechtstreeks op MQTT wil laten meelezen
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Dit netwerk draait geïsoleerd op het festivalterrein achter de Unifi-switches, én (sinds
# specs/toegang-van-buitenaf-diagnose.md) worden deze poorten niet meer naar de docker-host
# gepubliceerd (zie docker-compose.yml) — alleen de webapp zelf (interne docker-netwerk) kan hier
# nog bij, via zijn eigen sessie-gegated /mqtt-websocketproxy. allow_anonymous true is daarom
# veilig, ook met een publieke internetuplink naar de webapp erbij (die uplink loopt via Caddy naar
# de webapp, nooit rechtstreeks naar mosquitto) — geen wachtwoordbestand nodig zolang dat zo blijft.
allow_anonymous true
