listener 1883
protocol mqtt

# Websockets, handig als je ooit een browser-dashboard rechtstreeks op MQTT wil laten meelezen
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Dit netwerk draait geïsoleerd op het festivalterrein achter de Unifi-switches. Poort 1883 is wél
# naar de docker-host gepubliceerd (zie docker-compose.yml) — fysieke Shelly's praten rechtstreeks
# TCP/MQTT en kunnen niet via de webapp's sessie-gegated /mqtt-websocketproxy (dat is alleen voor
# browsers, zie specs/toegang-van-buitenaf-diagnose.md). Poort 9001 (websockets) is wel dicht
# gebleven — daar gaat alleen de browser overheen, via de webapp-proxy. allow_anonymous true is
# hetzelfde vertrouwensmodel als poort 8080 op het lokale netwerk (zie ook
# specs/shelly-auto-configuratie-plan.md) — geen wachtwoordbestand nodig zolang 1883 alleen op het
# lokale festivalnetwerk bereikbaar is (nooit naar het publieke internet routeren, zie README).
allow_anonymous true
