[agent]
  interval = "1s"
  flush_interval = "1s"

[global_tags]
  editie = "$EVENT_EDITION"
  evenement = "$EVENT_NAME"

# --- Input: live vermogensmetingen per fase (em:0) ---
[[inputs.mqtt_consumer]]
  name_override = "shelly_em"
  servers = ["tcp://mosquitto:1883"]
  topics = ["site/+/+/status/em:0"]
  data_format = "json"
  json_strict = false

  [inputs.mqtt_consumer.tags]
    bron = "lokaal"

  # topic = site/<generator>/<kast>/status/em:0
  # "_" = segment negeren, benoemde velden worden tags
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "site/+/+/status/em:0"
    tags = "_/generator/kast/_/_"

# --- Input: cumulatieve energietelling per fase (emdata:0) ---
[[inputs.mqtt_consumer]]
  name_override = "shelly_emdata"
  servers = ["tcp://mosquitto:1883"]
  topics = ["site/+/+/status/emdata:0"]
  data_format = "json"
  json_strict = false

  [inputs.mqtt_consumer.tags]
    bron = "lokaal"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "site/+/+/status/emdata:0"
    tags = "_/generator/kast/_/_"

# specs/externe-mqtt-broker-plan.md: permanent aanwezig, ongeacht of er een externe broker
# geconfigureerd is — dit blijft rechtstreeks op de LOKALE mosquitto lezen (nooit een extern, mogelijk
# onbereikbaar adres), gewoon een topic-patroon dat pas berichten krijgt zodra mosquitto's eigen
# bridge (Beheer > Instellingen > Externe MQTT-broker) actief is en `site/#` van de externe broker
# doorzet naar hier onder het `extern/`-prefix. Zonder actieve bridge komt hier domweg nooit een
# bericht binnen — geen foutmeldingen, geen kostbare verbindingspogingen.
# --- Input: live vermogensmetingen per fase, externe bron (em:0) ---
[[inputs.mqtt_consumer]]
  name_override = "shelly_em"
  servers = ["tcp://mosquitto:1883"]
  topics = ["extern/site/+/+/status/em:0"]
  data_format = "json"
  json_strict = false

  [inputs.mqtt_consumer.tags]
    bron = "extern"

  # topic = extern/site/<generator>/<kast>/status/em:0
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "extern/site/+/+/status/em:0"
    tags = "_/_/generator/kast/_/_"

# --- Input: cumulatieve energietelling per fase, externe bron (emdata:0) ---
[[inputs.mqtt_consumer]]
  name_override = "shelly_emdata"
  servers = ["tcp://mosquitto:1883"]
  topics = ["extern/site/+/+/status/emdata:0"]
  data_format = "json"
  json_strict = false

  [inputs.mqtt_consumer.tags]
    bron = "extern"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "extern/site/+/+/status/emdata:0"
    tags = "_/_/generator/kast/_/_"

# --- Output: InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "site"
  bucket = "stroomdata"
